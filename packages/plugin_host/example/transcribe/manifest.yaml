id: dev.mollygram.transcribe
name: Transcribe
version: 1.0.0
author: Mollygram
description: >-
  Transcribes voice and round video messages on the device, with no network
  and no Premium.
runtime: js
sdk: ^1.0
main: index.js
permissions:
  media.read: [voice, round]
  storage: 1mb
hooks:
  - message.render.voice
  - message.render.round
settings:
  - key: auto
    type: toggle
    label: Transcribe automatically
    default: false
  - key: language
    type: select
    label: Language
    default: auto
    options:
      - { value: auto, label: Detect automatically }
      - { value: ru, label: Russian }
      - { value: en, label: English }
