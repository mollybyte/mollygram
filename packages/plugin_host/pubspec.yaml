name: plugin_host
description: Sandbox for Mollygram JS plugins on quickjs-ng.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  code_assets: ^1.0.0
  hooks: ^2.2.0
  native_toolchain_c: ^0.19.0
  yaml: ^3.1.0
  ffi: ^2.1.0
  logging: ^1.3.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0

# The built-in plugins ship inside the app as assets of this package:
# packages/plugin_host/builtin/<name>/manifest.yaml and index.js.
flutter:
  assets:
    - builtin/filters/manifest.yaml
    - builtin/filters/index.js
    - builtin/translate/manifest.yaml
    - builtin/translate/index.js
    - builtin/code_highlight/manifest.yaml
    - builtin/code_highlight/index.js
