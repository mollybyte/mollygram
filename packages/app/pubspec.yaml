name: mollygram
description: Mollygram, a desktop Telegram client.
publish_to: none
version: 0.1.0
resolution: workspace
environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'
dependencies:
  app_links: ^7.2.2
  crypto: ^3.0.6
  desktop_drop: ^0.8.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  lottie: ^3.6.1
  media_kit_libs_video: ^1.0.7
  mollygram_core: any
  mollygram_media: any
  mollygram_media_editor: any
  mollygram_plugins_ui: any
  mollygram_shell: any
  mollygram_tdlib: any
  mollygram_ui_kit: any
  pasteboard: ^0.5.0
  plugin_host: any
  path_provider: ^2.1.6
  qr: ^4.0.0
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  generate: true
  uses-material-design: false
  assets:
    - assets/app_icon/
