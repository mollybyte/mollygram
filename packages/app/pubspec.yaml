name: mollygram
description: Mollygram, a desktop Telegram client.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  mollygram_core: any
  mollygram_media: any
  mollygram_tdlib: any
  mollygram_ui_kit: any
  mollygram_prototype:
    path: ../../prototype

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
