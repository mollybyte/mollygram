name: mollygram
description: Mollygram, a desktop Telegram client.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  # Native libmpv for mollygram_media. In a pub workspace media_kit_video
  # links against it as soon as any member depends on the libs package.
  media_kit_libs_video: ^1.0.7
  mollygram_core: any
  mollygram_media: any
  mollygram_tdlib: any
  mollygram_ui_kit: any
  path_provider: ^2.1.6
  qr: ^4.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: false
  assets:
    - assets/app_icon.png
