# Shared analysis rules. Packages include this file and add their own lint set
# (lints for pure Dart, flutter_lints for Flutter).
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
  exclude:
    - "**/build/**"
    - "**/macos/**"
    - "**/windows/**"
    - "**/linux/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - unawaited_futures
