name: mollygram_workspace
publish_to: none

environment:
  sdk: ^3.13.0

# A monorepo on pub workspaces: one pubspec.lock and one dependency resolution
# for all packages. The prototype/ directory is not included; it has its own
# pubspec.
workspace:
  - packages/tdlib
  - packages/core
  - packages/ui_kit
  - packages/media
  - packages/app
  - packages/plugin_host
  - packages/shell
