name: mollygram_workspace
publish_to: none

environment:
  sdk: ^3.13.0

# A monorepo on pub workspaces: one pubspec.lock and one dependency resolution
# for all packages.
workspace:
  - packages/tdlib
  - packages/calls
  - packages/core
  - packages/ui_kit
  - packages/media
  - packages/media/example
  - packages/media_editor
  - packages/app
  - packages/plugin_host
  - packages/shell
  - packages/plugins_ui

# The Mollygram store (packages/core/lib/src/store) is encrypted with
# SQLCipher: package:sqlite3 bundles a prebuilt SQLCipher instead of SQLite.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
