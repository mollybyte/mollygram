name: TDLib

# Builds libtdjson from the commit pinned in packages/tdlib/tdlib.json for
# macOS (arm64 + x86_64 in one universal dylib), Linux x64 and Windows x64.
# OpenSSL and zlib are linked statically so the library does not depend on
# Homebrew, the distribution's libssl or DLLs next to it on the user's machine.
# On main the result is published to the tdlib-<version>-<commit> release,
# which macos/scripts/bundle_tdjson.sh and release.yml download.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/tdlib/tdlib.json
      - .github/workflows/tdlib.yml
  pull_request:
    paths:
      - packages/tdlib/tdlib.json
      - .github/workflows/tdlib.yml

concurrency:
  group: tdlib-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENSSL_VERSION: 3.5.9
  OPENSSL_SHA256: 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
  MACOSX_DEPLOYMENT_TARGET: '11.0'
  ZLIB_VERSION: 1.3.1
  ZLIB_SHA256: 9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23
  # Static OpenSSL and zlib from vcpkg, with the shared C runtime that the
  # Flutter runner already needs.
  VCPKG_TRIPLET: x64-windows-static-md

jobs:
  pin:
    name: Read pinned version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pin.outputs.version }}
      commit: ${{ steps.pin.outputs.commit }}
      short: ${{ steps.pin.outputs.short }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: |
          echo "version=$(jq -r .version packages/tdlib/tdlib.json)" >> "$GITHUB_OUTPUT"
          commit=$(jq -r .commit packages/tdlib/tdlib.json)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "short=${commit:0:7}" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS ${{ matrix.arch }}
    needs: pin
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
            openssl_target: darwin64-arm64-cc
          - arch: x86_64
            os: macos-15-intel
            openssl_target: darwin64-x86_64-cc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Cache build
        id: cache
        uses: actions/cache@v4
        with:
          path: out/libtdjson.dylib
          key: tdjson-macos-${{ matrix.arch }}-${{ needs.pin.outputs.commit }}-openssl-${{ env.OPENSSL_VERSION }}-${{ env.MACOSX_DEPLOYMENT_TARGET }}

      - name: Install tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install gperf

      - name: Build OpenSSL
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o openssl.tar.gz \
            "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz"
          echo "$OPENSSL_SHA256  openssl.tar.gz" | shasum -a 256 -c -
          tar -xzf openssl.tar.gz
          cd "openssl-$OPENSSL_VERSION"
          ./Configure ${{ matrix.openssl_target }} no-shared no-tests no-docs \
            -mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET \
            --prefix="$GITHUB_WORKSPACE/openssl" --libdir=lib
          make -j"$(sysctl -n hw.ncpu)"
          make install_sw

      - name: Checkout TDLib
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git init td
          cd td
          git remote add origin https://github.com/tdlib/td.git
          git fetch --depth 1 origin ${{ needs.pin.outputs.commit }}
          git checkout FETCH_HEAD
          grep -q "project(TDLib VERSION ${{ needs.pin.outputs.version }} " CMakeLists.txt

      - name: Build libtdjson
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S td -B td/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET \
            -DOPENSSL_ROOT_DIR="$GITHUB_WORKSPACE/openssl" \
            -DOPENSSL_USE_STATIC_LIBS=ON
          cmake --build td/build --target tdjson -j"$(sysctl -n hw.ncpu)"
          mkdir -p out
          cp -L td/build/libtdjson.dylib out/libtdjson.dylib
          install_name_tool -id @rpath/libtdjson.dylib out/libtdjson.dylib
          strip -x out/libtdjson.dylib

      - name: Check linkage
        run: |
          otool -L out/libtdjson.dylib
          if otool -L out/libtdjson.dylib | tail -n +2 | grep -v -E '^[[:space:]]+(/usr/lib/|/System/|@rpath/libtdjson)'; then
            echo "::error::libtdjson links to libraries outside the system"
            exit 1
          fi
          lipo -archs out/libtdjson.dylib | grep -qx ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: libtdjson-macos-${{ matrix.arch }}
          path: out/libtdjson.dylib
          if-no-files-found: error

  universal:
    name: macOS universal
    needs: [pin, macos]
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: libtdjson-macos-*
      - name: Create universal dylib
        run: |
          mkdir -p dist
          lipo -create \
            libtdjson-macos-arm64/libtdjson.dylib \
            libtdjson-macos-x86_64/libtdjson.dylib \
            -output dist/libtdjson.dylib
          lipo -archs dist/libtdjson.dylib
      - name: Smoke test
        run: |
          version=$(python3 - <<'PY'
          import ctypes, json
          lib = ctypes.CDLL("dist/libtdjson.dylib")
          lib.td_execute.restype = ctypes.c_char_p
          lib.td_execute.argtypes = [ctypes.c_char_p]
          request = json.dumps({"@type": "getOption", "name": "version"}).encode()
          print(json.loads(lib.td_execute(request))["value"])
          PY
          )
          echo "libtdjson reports $version"
          test "$version" = "${{ needs.pin.outputs.version }}"
      - name: Package
        run: |
          cd dist
          zip -q libtdjson-macos-universal.zip libtdjson.dylib
          shasum -a 256 libtdjson-macos-universal.zip > libtdjson-macos-universal.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: libtdjson-macos-universal
          path: dist/libtdjson-macos-universal.zip*
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: pin
    runs-on: ubuntu-24.04
    steps:
      - name: Cache build
        id: cache
        uses: actions/cache@v4
        with:
          path: out/libtdjson.so
          key: tdjson-linux-x64-ubuntu-24.04-${{ needs.pin.outputs.commit }}-openssl-${{ env.OPENSSL_VERSION }}-zlib-${{ env.ZLIB_VERSION }}

      - name: Install tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf

      # Built from source with -fPIC: both end up inside a shared library.
      - name: Build OpenSSL
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o openssl.tar.gz \
            "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz"
          echo "$OPENSSL_SHA256  openssl.tar.gz" | sha256sum -c -
          tar -xzf openssl.tar.gz
          cd "openssl-$OPENSSL_VERSION"
          ./Configure linux-x86_64 no-shared no-tests no-docs -fPIC \
            --prefix="$GITHUB_WORKSPACE/openssl" --libdir=lib
          make -j"$(nproc)"
          make install_sw

      - name: Build zlib
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o zlib.tar.gz \
            "https://github.com/madler/zlib/releases/download/v$ZLIB_VERSION/zlib-$ZLIB_VERSION.tar.gz"
          echo "$ZLIB_SHA256  zlib.tar.gz" | sha256sum -c -
          tar -xzf zlib.tar.gz
          cd "zlib-$ZLIB_VERSION"
          CFLAGS="-O2 -fPIC" ./configure --static --prefix="$GITHUB_WORKSPACE/zlib"
          make -j"$(nproc)"
          make install

      - name: Checkout TDLib
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git init td
          cd td
          git remote add origin https://github.com/tdlib/td.git
          git fetch --depth 1 origin ${{ needs.pin.outputs.commit }}
          git checkout FETCH_HEAD
          grep -q "project(TDLib VERSION ${{ needs.pin.outputs.version }} " CMakeLists.txt

      - name: Build libtdjson
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S td -B td/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$GITHUB_WORKSPACE/openssl" \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DZLIB_INCLUDE_DIR="$GITHUB_WORKSPACE/zlib/include" \
            -DZLIB_LIBRARY="$GITHUB_WORKSPACE/zlib/lib/libz.a"
          cmake --build td/build --target tdjson -j"$(nproc)"
          mkdir -p out
          cp -L td/build/libtdjson.so out/libtdjson.so
          strip --strip-unneeded out/libtdjson.so

      - name: Check linkage
        run: |
          ldd out/libtdjson.so
          if ldd out/libtdjson.so | grep -v -E '^[[:space:]]+(linux-vdso\.so|/lib64/ld-linux-x86-64\.so|(libc|libm|libdl|libpthread|librt|libstdc\+\+|libgcc_s)\.so)'; then
            echo "::error::libtdjson links to libraries outside the system"
            exit 1
          fi

      - name: Smoke test
        run: |
          version=$(python3 - <<'PY'
          import ctypes, json
          lib = ctypes.CDLL("out/libtdjson.so")
          lib.td_execute.restype = ctypes.c_char_p
          lib.td_execute.argtypes = [ctypes.c_char_p]
          request = json.dumps({"@type": "getOption", "name": "version"}).encode()
          print(json.loads(lib.td_execute(request))["value"])
          PY
          )
          echo "libtdjson reports $version"
          test "$version" = "${{ needs.pin.outputs.version }}"

      - name: Package
        run: |
          mkdir -p dist
          cp out/libtdjson.so dist/
          cd dist
          zip -q libtdjson-linux-x64.zip libtdjson.so
          sha256sum libtdjson-linux-x64.zip > libtdjson-linux-x64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: libtdjson-linux-x64
          path: dist/libtdjson-linux-x64.zip*
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: pin
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Cache build
        id: cache
        uses: actions/cache@v4
        with:
          path: out/tdjson.dll
          key: tdjson-windows-x64-${{ needs.pin.outputs.commit }}-${{ env.VCPKG_TRIPLET }}

      # gperf is a build tool; the vcpkg toolchain puts the triplet's tools
      # on CMake's program path.
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          "$(cygpath -u "$VCPKG_INSTALLATION_ROOT")/vcpkg" install \
            "gperf:$VCPKG_TRIPLET" "openssl:$VCPKG_TRIPLET" "zlib:$VCPKG_TRIPLET"

      - name: Checkout TDLib
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git init td
          cd td
          git remote add origin https://github.com/tdlib/td.git
          git fetch --depth 1 origin ${{ needs.pin.outputs.commit }}
          git checkout FETCH_HEAD
          grep -q "project(TDLib VERSION ${{ needs.pin.outputs.version }} " CMakeLists.txt

      - name: Build tdjson.dll
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S td -B td/build -A x64 \
            -DCMAKE_TOOLCHAIN_FILE:FILEPATH="$(cygpath -m "$VCPKG_INSTALLATION_ROOT")/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET"
          cmake --build td/build --target tdjson --config Release
          mkdir -p out
          cp td/build/Release/tdjson.dll out/tdjson.dll

      - name: Check linkage
        run: |
          python -m pip install --quiet pefile
          python - <<'PY'
          import os, pefile, sys
          pe = pefile.PE("out/tdjson.dll")
          dlls = sorted(entry.dll.decode() for entry in pe.DIRECTORY_ENTRY_IMPORT)
          print("\n".join(dlls))
          # Windows itself (API sets and System32) and the MSVC runtime the
          # Flutter runner needs too; no OpenSSL or zlib DLLs.
          system32 = os.path.join(os.environ["SystemRoot"], "System32")
          def is_system(dll):
              name = dll.lower()
              if name.startswith(("api-ms-win-", "ext-ms-win-", "vcruntime140", "msvcp140")):
                  return True
              return not name.startswith(("libssl", "libcrypto", "zlib")) and \
                  os.path.exists(os.path.join(system32, name))
          other = [dll for dll in dlls if not is_system(dll)]
          if other:
              print("::error::tdjson.dll links to libraries outside the system: " + ", ".join(other))
              sys.exit(1)
          if pe.FILE_HEADER.Machine != pefile.MACHINE_TYPE["IMAGE_FILE_MACHINE_AMD64"]:
              print("::error::tdjson.dll is not x64")
              sys.exit(1)
          PY

      - name: Smoke test
        run: |
          version=$(python - <<'PY'
          import ctypes, json
          lib = ctypes.CDLL("out/tdjson.dll")
          lib.td_execute.restype = ctypes.c_char_p
          lib.td_execute.argtypes = [ctypes.c_char_p]
          request = json.dumps({"@type": "getOption", "name": "version"}).encode()
          print(json.loads(lib.td_execute(request))["value"])
          PY
          )
          version=$(printf '%s' "$version" | tr -d '\r')
          echo "libtdjson reports $version"
          test "$version" = "${{ needs.pin.outputs.version }}"

      # Git Bash has no zip; 7-Zip is on the Windows runner image.
      - name: Package
        run: |
          mkdir -p dist
          cp out/tdjson.dll dist/
          cd dist
          7z a -tzip -bso0 tdjson-windows-x64.zip tdjson.dll
          sha256sum tdjson-windows-x64.zip > tdjson-windows-x64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: tdjson-windows-x64
          path: dist/tdjson-windows-x64.zip*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [pin, universal, linux, windows]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: tdlib-${{ needs.pin.outputs.version }}-${{ needs.pin.outputs.short }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: libtdjson-macos-universal
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: libtdjson-linux-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: tdjson-windows-x64
          path: dist
      - run: ls -l dist
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: TDLib ${{ needs.pin.outputs.version }}
          body: |
            libtdjson ${{ needs.pin.outputs.version }} built from tdlib/td@${{ needs.pin.outputs.commit }}:
            - macOS (arm64 + x86_64), OpenSSL ${{ env.OPENSSL_VERSION }} linked statically, minimum macOS ${{ env.MACOSX_DEPLOYMENT_TARGET }}.
            - Linux x64, OpenSSL ${{ env.OPENSSL_VERSION }} and zlib ${{ env.ZLIB_VERSION }} linked statically, built on Ubuntu 24.04.
            - Windows x64, OpenSSL and zlib from vcpkg (${{ env.VCPKG_TRIPLET }}) linked statically.
          files: |
            dist/libtdjson-macos-universal.zip
            dist/libtdjson-macos-universal.zip.sha256
            dist/libtdjson-linux-x64.zip
            dist/libtdjson-linux-x64.zip.sha256
            dist/tdjson-windows-x64.zip
            dist/tdjson-windows-x64.zip.sha256
          make_latest: false
