name: Plugin host

on:
  push:
    branches: [main]
    paths: [packages/plugin_host/**, packages/plugin_sdk/**, .github/workflows/plugin_host.yml]
  pull_request:
    paths: [packages/plugin_host/**, packages/plugin_sdk/**, .github/workflows/plugin_host.yml]
  workflow_dispatch:

concurrency:
  group: plugin-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/plugin_host
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - if: matrix.os == 'ubuntu-latest'
        run: dart format --output=none --set-exit-if-changed .
      - if: matrix.os == 'ubuntu-latest'
        run: dart analyze --fatal-infos
      - run: dart test

  sdk:
    name: Typecheck SDK and example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Example compiles and matches committed index.js
        working-directory: packages/plugin_host/example/transcribe
        run: |
          npx --yes -p typescript@5.9 tsc -p .
          git diff --exit-code index.js
