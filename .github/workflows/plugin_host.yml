name: Plugin host

# Also checks packages/plugins_ui, the plugins settings screen: it depends on
# plugin_host, so its tests need the same QuickJS submodule.
#
# Pull requests test on Linux only. The native QuickJS build on macOS and
# Windows runs on main, on manual runs, and on pull requests labelled
# `full-ci`.

on:
  push:
    branches: [main]
    paths: [packages/plugin_host/**, packages/plugin_sdk/**, packages/plugins_ui/**, pubspec.yaml, pubspec.lock, .fvmrc, .gitmodules, .github/workflows/plugin_host.yml]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: [packages/plugin_host/**, packages/plugin_sdk/**, packages/plugins_ui/**, pubspec.yaml, pubspec.lock, .fvmrc, .gitmodules, .github/workflows/plugin_host.yml]
  workflow_dispatch:

concurrency:
  group: plugin-host-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test on ${{ matrix.os }}
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/plugin_host
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # The package is part of the pub workspace alongside the Flutter
      # packages, so dependencies are installed by the same Flutter version as
      # in the rest of CI.
      - name: Read Flutter version
        shell: bash
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"
        working-directory: .
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - if: matrix.os == 'ubuntu-latest'
        run: dart format --output=none --set-exit-if-changed .
      - if: matrix.os == 'ubuntu-latest'
        run: dart analyze --fatal-infos
      - run: dart test

  sdk:
    name: Typecheck SDK and example
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Example and built-in plugins compile and match committed index.js
        working-directory: packages/plugin_host
        run: |
          for d in example/transcribe builtin/filters builtin/translate; do
            (cd "$d" && npx --yes -p typescript@5.9 tsc -p .)
          done
          git diff --exit-code -- '*.js'

  ui:
    name: Plugins screen
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/plugins_ui
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Read Flutter version
        shell: bash
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"
        working-directory: .
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test
