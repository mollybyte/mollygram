name: PR title

# Pull requests are squash-merged, so the PR title becomes the commit message
# on main. release-please reads those messages to pick the next version and
# write CHANGELOG.md, which is why the title must be a Conventional Commit.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            style
            chore
            revert
          scopes: |
            app
            core
            tdlib
            ui_kit
            media
            media_editor
            shell
            plugin_host
            plugin_sdk
            plugins_ui
            calls
            design
            web
            docs
            ci
            deps
            release
          requireScope: false
          # An optional gitmoji may follow the colon; the description itself
          # starts lowercase: "feat(app): add tabs", "fix: ✨ handle ...".
          subjectPattern: ^(?:[^\x00-\x7F]+\s+)?[a-z0-9`'"(.].*$
          subjectPatternError: |
            The description "{subject}" in "{title}" must start with a lowercase
            letter, optionally after a gitmoji. Example: "feat(app): add chat tabs".
