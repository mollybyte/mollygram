name: Release

# Runs when release-please creates a release (called from
# release-please.yml) or when a v* tag is pushed by hand.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.2.0
        type: string
        required: true

permissions:
  contents: write


jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            path: packages/app/build/macos/Build/Products/Release
          - os: windows-latest
            target: windows
            path: packages/app/build/windows/x64/runner/Release
            tdjson: tdjson-windows-x64
            tdjson_dir: .
          - os: ubuntu-latest
            target: linux
            path: packages/app/build/linux/x64/release/bundle
            tdjson: libtdjson-linux-x64
            tdjson_dir: lib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # plugin_host (quickjs-ng) is a submodule; the app links it.
          submodules: true
      # The project uses a single Flutter version, taken from .fvmrc.
      - name: Read Flutter version
        shell: bash
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"
        working-directory: .
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libmpv-dev libepoxy-dev
      # api_id and api_hash come from the repository secrets TELEGRAM_API_ID and
      # TELEGRAM_API_HASH and only ever land in a file on the runner.
      - name: Write Telegram API keys
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ]; then
            echo "::error::Secrets TELEGRAM_API_ID and TELEGRAM_API_HASH are not set"
            exit 1
          fi
          jq -n --arg id "$TELEGRAM_API_ID" --arg hash "$TELEGRAM_API_HASH" \
            '{TELEGRAM_API_ID: $id, TELEGRAM_API_HASH: $hash}' > config/telegram.json
      - run: flutter pub get
        working-directory: packages/app
      - run: flutter build ${{ matrix.target }} --release --dart-define-from-file=../../config/telegram.json
        working-directory: packages/app
      # macOS copies libtdjson into the app in the Xcode build
      # (macos/scripts/bundle_tdjson.sh). Windows and Linux take it from the
      # tdlib-<version>-<commit> release built by tdlib.yml and keep it where
      # TelegramSessionLauncher looks: next to mollygram.exe, and in lib/.
      - name: Bundle libtdjson
        if: matrix.tdjson
        shell: bash
        run: |
          version=$(jq -r .version packages/tdlib/tdlib.json)
          commit=$(jq -r .commit packages/tdlib/tdlib.json)
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/tdlib-$version-${commit:0:7}"
          zip="${{ matrix.tdjson }}.zip"
          tmp=tdjson-download
          mkdir -p "$tmp"
          curl -fsSL -o "$tmp/$zip" "$base/$zip"
          curl -fsSL -o "$tmp/$zip.sha256" "$base/$zip.sha256"
          (cd "$tmp" && sha256sum -c "$zip.sha256")
          destination="${{ matrix.path }}/${{ matrix.tdjson_dir }}"
          mkdir -p "$destination"
          if [ "$RUNNER_OS" = Windows ]; then
            7z x -y -bso0 -o"$destination" "$tmp/$zip"
            test -f "$destination/tdjson.dll"
          else
            unzip -o -q "$tmp/$zip" -d "$destination"
            test -f "$destination/libtdjson.so"
          fi
          ls -l "$destination"
      - uses: actions/upload-artifact@v4
        with:
          name: mollygram-${{ matrix.target }}
          path: ${{ matrix.path }}

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - run: cd dist && for d in */; do zip -qr "${d%/}.zip" "$d"; done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.zip
          # release-please already wrote the notes from CHANGELOG.md.
          generate_release_notes: ${{ inputs.tag == '' }}
