name: Release

# Runs when release-please creates a release (called from
# release-please.yml) or when a v* tag is pushed by hand.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.2.0
        type: string
        required: true

permissions:
  contents: write


jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            path: packages/app/build/macos/Build/Products/Release
          - os: windows-latest
            target: windows
            path: packages/app/build/windows/x64/runner/Release
          - os: ubuntu-latest
            target: linux
            path: packages/app/build/linux/x64/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      # The project uses a single Flutter version, taken from .fvmrc.
      - name: Read Flutter version
        shell: bash
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"
        working-directory: .
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      # api_id and api_hash come from the repository secrets TELEGRAM_API_ID and
      # TELEGRAM_API_HASH and only ever land in a file on the runner.
      - name: Write Telegram API keys
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ]; then
            echo "::error::Secrets TELEGRAM_API_ID and TELEGRAM_API_HASH are not set"
            exit 1
          fi
          jq -n --arg id "$TELEGRAM_API_ID" --arg hash "$TELEGRAM_API_HASH" \
            '{TELEGRAM_API_ID: $id, TELEGRAM_API_HASH: $hash}' > config/telegram.json
      - run: flutter pub get
        working-directory: packages/app
      - run: flutter build ${{ matrix.target }} --release --dart-define-from-file=../../config/telegram.json
        working-directory: packages/app
      - uses: actions/upload-artifact@v4
        with:
          name: mollygram-${{ matrix.target }}
          path: ${{ matrix.path }}

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - run: cd dist && for d in */; do zip -qr "${d%/}.zip" "$d"; done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.zip
          # release-please already wrote the notes from CHANGELOG.md.
          generate_release_notes: ${{ inputs.tag == '' }}
