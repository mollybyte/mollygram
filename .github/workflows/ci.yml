name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Пакеты монорепо, которые проверяет этот workflow. plugin_host
  # проверяется своим job'ом.
  PACKAGES: tdlib core ui_kit media app

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Версия Flutter одна на проект и берётся из .fvmrc.
      - name: Read Flutter version
        shell: bash
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"
        working-directory: .
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: |
          for p in $PACKAGES; do dirs="$dirs packages/$p"; done
          dart format --output=none --set-exit-if-changed $dirs
      - name: Analyze
        run: |
          for p in $PACKAGES; do dirs="$dirs packages/$p"; done
          flutter analyze $dirs
      - name: Generated td_api is up to date
        run: |
          dart run packages/tdlib/tool/generate.dart
          git diff --exit-code packages/tdlib/lib/src/generated
      - name: Test
        run: |
          for p in $PACKAGES; do
            [ -d "packages/$p/test" ] || continue
            echo "::group::$p"
            if grep -q 'sdk: flutter' "packages/$p/pubspec.yaml"; then
              (cd "packages/$p" && flutter test)
            else
              (cd "packages/$p" && dart test)
            fi
            echo "::endgroup::"
          done

  build:
    name: Build ${{ matrix.target }}
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@v4
      # Версия Flutter одна на проект и берётся из .fvmrc.
      - name: Read Flutter version
        shell: bash
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"
        working-directory: .
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      # В CI ключей нет: сборка проверяет только, что приложение собирается.
      - run: flutter build ${{ matrix.target }} --release --dart-define-from-file=../../config/telegram.example.json
