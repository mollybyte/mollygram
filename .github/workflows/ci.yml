name: CI

# Pull requests get the fast layer only: format, analyze, codegen check and
# tests on Linux. Desktop builds (macOS minutes are the most expensive) run on
# main, on manual runs, and on pull requests labelled `full-ci`. Changes that
# touch none of the paths below (docs, design, website, prototype) skip this
# workflow entirely.

on:
  push:
    branches: [main]
    paths:
      - packages/tdlib/**
      - packages/core/**
      - packages/ui_kit/**
      - packages/media/**
      - packages/app/**
      - packages/shell/**
      - assets/icon/**
      - config/**
      - pubspec.yaml
      - pubspec.lock
      - analysis_options.yaml
      - .fvmrc
      - .github/workflows/ci.yml
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - packages/tdlib/**
      - packages/core/**
      - packages/ui_kit/**
      - packages/media/**
      - packages/app/**
      - packages/shell/**
      - assets/icon/**
      - config/**
      - pubspec.yaml
      - pubspec.lock
      - analysis_options.yaml
      - .fvmrc
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  # A new push cancels the running check of the same PR. Adding an unrelated
  # label gets its own group, so it does not cancel anything.
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Monorepo packages checked by this workflow. plugin_host
  # is checked by its own job.
  PACKAGES: tdlib core ui_kit media shell app

jobs:
  analyze:
    name: Analyze and test
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The project uses a single Flutter version, taken from .fvmrc.
      - name: Read Flutter version
        shell: bash
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"
        working-directory: .
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: |
          for p in $PACKAGES; do dirs="$dirs packages/$p"; done
          dart format --output=none --set-exit-if-changed $dirs
      - name: Analyze
        run: |
          for p in $PACKAGES; do dirs="$dirs packages/$p"; done
          flutter analyze $dirs
      - name: Generated td_api is up to date
        run: |
          dart run packages/tdlib/tool/generate.dart
          git diff --exit-code packages/tdlib/lib/src/generated
      - name: Test
        run: |
          for p in $PACKAGES; do
            [ -d "packages/$p/test" ] || continue
            echo "::group::$p"
            if grep -q 'sdk: flutter' "packages/$p/pubspec.yaml"; then
              (cd "packages/$p" && flutter test)
            else
              (cd "packages/$p" && dart test)
            fi
            echo "::endgroup::"
          done

  build:
    name: Build ${{ matrix.target }}
    needs: analyze
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@v4
      # The project uses a single Flutter version, taken from .fvmrc.
      - name: Read Flutter version
        shell: bash
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"
        working-directory: .
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # libmpv and libepoxy: media_kit_video (packages/media) links them on
      # Linux.
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev libepoxy-dev
      - run: flutter pub get
      # CI has no keys: the build only checks that the app compiles.
      - run: flutter build ${{ matrix.target }} --release --dart-define-from-file=../../config/telegram.example.json

  media-bench:
    name: Build media benchmark (macOS)
    needs: analyze
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/media/example
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter version
        shell: bash
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"
        working-directory: .
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Only checks that it builds: the CI VM has no 120 Hz display and its
      # virtual GPU crashes media_kit (see prototype results). The numbers
      # come from a real Mac, see packages/media/example/README.md.
      - run: flutter build macos --profile
