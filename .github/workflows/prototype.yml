name: Prototype

# Pull requests get analyze and tests only. The macOS build and frame
# benchmark run on main, on manual runs, and on pull requests labelled
# `full-ci`.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ['prototype/**', '.github/workflows/prototype.yml']
  push:
    branches: [main]
    paths: ['prototype/**', '.github/workflows/prototype.yml']
  workflow_dispatch:

concurrency:
  group: prototype-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: prototype

jobs:
  check:
    name: Analyze and test
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7  # as in prototype/.fvmrc
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  macos:
    name: Build macOS and run frame benchmark
    needs: check
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7  # as in prototype/.fvmrc
          cache: true
      - run: flutter pub get
      - run: flutter build macos --profile
      - name: Pack app
        run: ditto -c -k --keepParent build/macos/Build/Products/Profile/mollygram_prototype.app mollygram_prototype.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mollygram-prototype-macos-profile
          path: prototype/mollygram_prototype.zip
      # A virtual machine without 120 Hz and with a virtual GPU: the numbers only
      # check that the measurement works. Real ones are taken on a Mac.
      - name: Frame benchmark (CI VM)
        continue-on-error: true
        run: |
          MG_AUTOBENCH=1 perl -e 'alarm 240; exec @ARGV' \
            build/macos/Build/Products/Profile/mollygram_prototype.app/Contents/MacOS/mollygram_prototype \
            > bench.log 2>&1 || true
          sed -n '/MG_BENCH_REPORT_BEGIN/,/MG_BENCH_REPORT_END/p' bench.log | sed '1d;$d' > report.txt
          if [ -s report.txt ]; then
            { echo '### Frame timing on CI (virtual machine)'; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            cat report.txt
          else
            echo "No report produced, last lines of the log:"
            tail -40 bench.log
            sleep 5
            crash=$(ls -t ~/Library/Logs/DiagnosticReports/mollygram_prototype* 2>/dev/null | head -1)
            if [ -n "$crash" ]; then
              echo "Crash report: $crash"
              head -c 20000 "$crash"
            fi
            exit 1
          fi
